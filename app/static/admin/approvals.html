<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Approvals - GFS Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/static/css/theme.css" rel="stylesheet" />
</head>
<body>
  <div id="header"></div>
  <main class="container pb-5">
    <h1 class="h4 mb-1">Approvals queue</h1>
    <p class="muted">Immediate requests can only be approved when the vehicle is Available. Advance Reservations may be approved for a future window even if the car is currently out.</p>
    <div id="list" class="vstack gap-3"></div>
    <p id="err" class="text-danger mt-3"></p>
  </main>
  <script src="/static/js/api.js?v=2"></script>
  <script>
    GFS.ready(function (GFS) {
    var api = GFS.api, renderHeader = GFS.renderHeader, wireLogout = GFS.wireLogout, formatDt = GFS.formatDt;
    if (!api.requireAuth({ managerOnly: true })) return;
    document.getElementById("header").innerHTML = renderHeader("approvals", "admin");
    wireLogout();

    async function decide(id, decision) {
      let RejectionReason = null;
      if (decision === "Reject") {
        RejectionReason = prompt("Rejection reason (required):");
        if (!RejectionReason || !RejectionReason.trim()) return;
      }
      try {
        await api.post(`/api/bookings/${id}/decide`, { Decision: decision, RejectionReason });
        location.reload();
      } catch (e) {
        alert(e.message);
      }
    }

    api.get("/api/bookings/pending").then(rows => {
      const el = document.getElementById("list");
      if (!rows.length) {
        el.innerHTML = `<div class="gfs-card muted">No pending requests.</div>`;
        return;
      }
      el.innerHTML = rows.map(b => {
        const windowTxt = b.BookingType === "Advance Reservation"
          ? `Window: ${formatDt(b.ReservationStart)} → ${formatDt(b.ReservationEnd)}`
          : "Immediate (needs vehicle Available now)";
        const statusNote = b.VehicleCurrentStatus
          ? `<div class="small mt-1">Vehicle now: <strong>${b.VehicleCurrentStatus}</strong></div>`
          : "";
        const block = !b.CanApproveNow
          ? `<div class="alert alert-warning py-2 small mt-2 mb-0">${b.ApproveBlockedReason || "Cannot approve yet"}</div>`
          : (b.BookingType === "Advance Reservation" && b.VehicleCurrentStatus && b.VehicleCurrentStatus !== "Available"
            ? `<div class="alert alert-info py-2 small mt-2 mb-0">Future reservation - vehicle is currently ${b.VehicleCurrentStatus}. Approval books the later slot after it returns.</div>`
            : "");
        const approveBtn = b.CanApproveNow
          ? `<button class="btn btn-sm btn-success" onclick="decide(${b.BookingID}, 'Approve')">Approve</button>`
          : `<button class="btn btn-sm btn-success" disabled title="${(b.ApproveBlockedReason || '').replace(/"/g, '&quot;')}">Approve</button>`;
        return `
        <div class="gfs-card">
          <div class="d-flex flex-wrap justify-content-between gap-2">
            <div>
              <strong>#${b.BookingID} - ${b.DriverName}</strong>
              <span class="record-${b.BorrowingRecordLabel} ms-2">${b.BorrowingRecordLabel} record (${b.BorrowingRecordScore})</span>
              <div class="small muted">${formatDt(b.RequestedAt)} · ${b.BookingType}</div>
              <div class="small muted">${windowTxt}</div>
            </div>
            <div class="text-end">
              <div>${b.VehicleMakeModel}</div>
              <div class="small muted">${b.VehicleReg}</div>
              ${statusNote}
            </div>
          </div>
          <div class="mt-2"><strong>Purpose:</strong> ${b.PurposeReason}</div>
          <div><strong>Destination:</strong> ${b.Destination}</div>
          ${block}
          <div class="mt-3 d-flex gap-2">
            ${approveBtn}
            <button class="btn btn-sm btn-outline-danger" onclick="decide(${b.BookingID}, 'Reject')">Reject</button>
          </div>
        </div>`;
      }).join("");
    }).catch(e => document.getElementById("err").textContent = e.message);

    window.decide = decide;
    });
  </script>
</body>
</html>
