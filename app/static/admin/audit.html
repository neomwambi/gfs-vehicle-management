<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audit Log - GFS Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/static/css/theme.css" rel="stylesheet" />
</head>
<body>
  <div id="header"></div>
  <main class="container pb-5">
    <h1 class="h4 mb-3">Audit log</h1>
    <div class="gfs-card table-responsive">
      <table class="table table-sm mb-0">
        <thead>
          <tr><th>When</th><th>Who</th><th>Table</th><th>Record</th><th>Action</th><th>Old</th><th>New</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <script src="/static/js/api.js?v=2"></script>
  <script>
    GFS.ready(function (GFS) {
    var api = GFS.api, renderHeader = GFS.renderHeader, wireLogout = GFS.wireLogout, formatDt = GFS.formatDt;
    if (!api.requireAuth({ managerOnly: true })) return;
    document.getElementById("header").innerHTML = renderHeader("audit", "admin");
    wireLogout();

    api.get("/api/admin/audit").then(rows => {
      document.getElementById("rows").innerHTML = rows.map(r => `
        <tr>
          <td class="small text-nowrap">${formatDt(r.ChangedAt)}</td>
          <td>${r.ChangedByName || "-"}</td>
          <td>${r.TableName}</td>
          <td>${r.RecordID}</td>
          <td>${r.Action}</td>
          <td class="small" style="max-width:180px;overflow:hidden;text-overflow:ellipsis">${r.OldValue || ""}</td>
          <td class="small" style="max-width:220px;overflow:hidden;text-overflow:ellipsis">${r.NewValue || ""}</td>
        </tr>`).join("");
    });
    });
  </script>
</body>
</html>
