<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sent Emails - GFS Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/static/css/theme.css" rel="stylesheet" />
</head>
<body>
  <div id="header"></div>
  <main class="container pb-5">
    <h1 class="h4 mb-1">Sent emails (simulated)</h1>
    <p class="muted">Nothing is sent externally - each notification is logged here for the demo.</p>
    <div id="list" class="vstack gap-3"></div>
  </main>
  <script src="/static/js/api.js?v=2"></script>
  <script>
    GFS.ready(function (GFS) {
    var api = GFS.api, renderHeader = GFS.renderHeader, wireLogout = GFS.wireLogout, formatDt = GFS.formatDt;
    if (!api.requireAuth({ managerOnly: true })) return;
    document.getElementById("header").innerHTML = renderHeader("emails", "admin");
    wireLogout();

    api.get("/api/admin/notifications").then(rows => {
      document.getElementById("list").innerHTML = rows.map(n => `
        <div class="gfs-card">
          <div class="d-flex justify-content-between gap-2 flex-wrap">
            <strong>${n.Subject}</strong>
            <span class="small muted">${formatDt(n.SentAt)}</span>
          </div>
          <div class="small mt-1">To: ${n.RecipientName} (${n.RecipientRole}) · Type: ${n.EmailType}
            ${n.BookingID ? ` · Booking #${n.BookingID}` : ""}</div>
          <pre class="small mt-2 mb-0 p-2 bg-light border rounded" style="white-space:pre-wrap">${n.Body}</pre>
        </div>`).join("") || `<div class="muted">No notifications yet.</div>`;
    });
    });
  </script>
</body>
</html>
