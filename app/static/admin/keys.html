<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keys - GFS Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/static/css/theme.css" rel="stylesheet" />
</head>
<body>
  <div id="header"></div>
  <main class="container pb-5">
    <h1 class="h4 mb-1">Key handover &amp; return</h1>
    <p class="muted">Only bookings you approved appear here. Confirm physical key hand-over / return in person.</p>

    <h2 class="h6 mt-4">Awaiting key collection</h2>
    <div id="handover" class="vstack gap-2 mb-4"></div>

    <h2 class="h6">Awaiting key return</h2>
    <div id="returns" class="vstack gap-2"></div>
    <p id="err" class="text-danger mt-3"></p>
  </main>
  <script src="/static/js/api.js?v=2"></script>
  <script>
    GFS.ready(function (GFS) {
    var api = GFS.api, renderHeader = GFS.renderHeader, wireLogout = GFS.wireLogout;
    var formatDt = GFS.formatDt, statusPill = GFS.statusPill;
    if (!api.requireAuth({ managerOnly: true })) return;
    document.getElementById("header").innerHTML = renderHeader("keys", "admin");
    wireLogout();

    async function collect(id) {
      try {
        await api.post(`/api/bookings/${id}/key-collected`, {});
        location.reload();
      } catch (e) { alert(e.message); }
    }
    async function returned(id) {
      try {
        await api.post(`/api/bookings/${id}/key-returned`, {});
        location.reload();
      } catch (e) { alert(e.message); }
    }

    Promise.all([
      api.get("/api/bookings/awaiting-key-handover"),
      api.get("/api/bookings/awaiting-key-return"),
    ]).then(([hand, ret]) => {
      document.getElementById("handover").innerHTML = hand.map(b => `
        <div class="gfs-card d-flex justify-content-between align-items-center gap-3">
          <div>
            <strong>#${b.BookingID}</strong> ${b.DriverName} · ${b.VehicleReg}
            <div class="small muted">${b.PurposeReason} → ${b.Destination}</div>
          </div>
          <button class="btn btn-sm btn-sb" onclick="collect(${b.BookingID})">Confirm key handed over</button>
        </div>`).join("") || `<div class="muted">None waiting for handover.</div>`;

      document.getElementById("returns").innerHTML = ret.map(b => `
        <div class="gfs-card d-flex justify-content-between align-items-center gap-3">
          <div>
            <strong>#${b.BookingID}</strong> ${b.DriverName} · ${b.VehicleReg} ${statusPill(b.BookingStatus)}
            <div class="small muted">Checked in ${formatDt(b.CheckInTimestamp)}${b.DamageNoted ? " · DAMAGE REPORTED" : ""}</div>
          </div>
          <button class="btn btn-sm btn-sb" onclick="returned(${b.BookingID})">Confirm key returned</button>
        </div>`).join("") || `<div class="muted">None waiting for key return.</div>`;
    }).catch(e => document.getElementById("err").textContent = e.message);

    window.collect = collect;
    window.returned = returned;
    });
  </script>
</body>
</html>
