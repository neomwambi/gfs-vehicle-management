<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vehicles - GFS Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/static/css/theme.css" rel="stylesheet" />
</head>
<body>
  <div id="header"></div>
  <main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Vehicle management</h1>
    </div>
    <div class="row g-4">
      <div class="col-lg-7">
        <div class="gfs-card table-responsive">
          <table class="table table-sm mb-0">
            <thead>
              <tr><th>Reg</th><th>Model</th><th>Status</th><th>Mileage</th><th>Service</th><th>Active</th><th></th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
      <div class="col-lg-5">
        <form id="form" class="gfs-card">
          <h2 class="h6">Add vehicle</h2>
          <div class="mb-2"><label class="form-label">Registration</label><input id="reg" class="form-control" required /></div>
          <div class="mb-2"><label class="form-label">Make / Model</label><input id="make" class="form-control" required /></div>
          <div class="mb-2"><label class="form-label">Current mileage</label><input type="number" id="mileage" class="form-control" value="0" min="0" required /></div>
          <div class="mb-2"><label class="form-label">Parking location</label><input id="park" class="form-control" required /></div>
          <div class="row g-2 mb-2">
            <div class="col"><label class="form-label">Service interval km</label><input type="number" id="interval" class="form-control" value="15000" /></div>
            <div class="col"><label class="form-label">Alert threshold km</label><input type="number" id="threshold" class="form-control" value="500" /></div>
          </div>
          <div class="mb-3"><label class="form-label">Last service mileage</label><input type="number" id="lastSvc" class="form-control" value="0" /></div>
          <button class="btn btn-sb" type="submit">Add vehicle</button>
          <p id="msg" class="small mt-2 mb-0"></p>
        </form>
      </div>
    </div>
  </main>
  <script src="/static/js/api.js?v=2"></script>
  <script>
    GFS.ready(function (GFS) {
    var api = GFS.api, renderHeader = GFS.renderHeader, wireLogout = GFS.wireLogout, statusPill = GFS.statusPill;
    if (!api.requireAuth({ managerOnly: true })) return;
    document.getElementById("header").innerHTML = renderHeader("vehicles", "admin");
    wireLogout();

    async function toggle(id) {
      try {
        await api.post(`/api/vehicles/${id}/toggle-active`, {});
        location.reload();
      } catch (e) { alert(e.message); }
    }

    function load() {
      api.get("/api/vehicles?all=true").then(rows => {
        document.getElementById("rows").innerHTML = rows.map(v => `
          <tr class="${v.IsActive ? "" : "table-secondary"}">
            <td>${v.RegistrationNumber}</td>
            <td>${v.MakeModel}</td>
            <td>${statusPill(v.CurrentStatus)}</td>
            <td>${v.CurrentMileage.toLocaleString()}</td>
            <td class="small">${v.ServiceDueSoon ? `<span class="text-danger">Due soon (${v.KmUntilService} km)</span>` : `${v.KmUntilService} km left`}</td>
            <td>${v.IsActive ? "Yes" : "No"}</td>
            <td><button class="btn btn-sm btn-sb-outline" onclick="toggle(${v.VehicleID})">${v.IsActive ? "Deactivate" : "Activate"}</button></td>
          </tr>`).join("");
      });
    }

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      try {
        await api.post("/api/vehicles", {
          RegistrationNumber: document.getElementById("reg").value,
          MakeModel: document.getElementById("make").value,
          CurrentMileage: Number(document.getElementById("mileage").value),
          CurrentParkingLocation: document.getElementById("park").value,
          ServiceIntervalKm: Number(document.getElementById("interval").value),
          ServiceAlertThresholdKm: Number(document.getElementById("threshold").value),
          LastServiceMileage: Number(document.getElementById("lastSvc").value),
        });
        msg.className = "small mt-2 mb-0 text-success";
        msg.textContent = "Vehicle added.";
        e.target.reset();
        load();
      } catch (err) {
        msg.className = "small mt-2 mb-0 text-danger";
        msg.textContent = err.message;
      }
    };

    window.toggle = toggle;
    load();
    });
  </script>
</body>
</html>
