<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Check-In - GFS App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/static/css/theme.css" rel="stylesheet" />
</head>
<body>
  <div id="header"></div>
  <main class="container pb-5">
    <h1 class="h4 mb-1">Check-In / Return</h1>
    <p class="muted">5 photos required. Report any damage so managers are alerted immediately.</p>
    <div class="row g-4">
      <div class="col-lg-5">
        <div class="gfs-card mb-3">
          <label class="form-label">Booking</label>
          <select id="booking" class="form-select"></select>
          <div id="bookingInfo" class="small muted mt-2"></div>
        </div>
        <div class="gfs-card">
          <label class="form-label">Angle</label>
          <select id="angle" class="form-select mb-2">
            <option value="front">Front</option>
            <option value="back">Back</option>
            <option value="left">Left</option>
            <option value="right">Right</option>
            <option value="odometer">Odometer</option>
          </select>
          <div class="camera-box mb-2"><video id="video" autoplay playsinline></video></div>
          <canvas id="canvas" class="d-none"></canvas>
          <div class="d-flex gap-2 mb-2">
            <button type="button" class="btn btn-sb-outline btn-sm" id="startCam">Start camera</button>
            <button type="button" class="btn btn-sb btn-sm" id="snap">Capture</button>
          </div>
          <div class="photo-thumbs d-flex flex-wrap gap-2" id="thumbs"></div>
        </div>
      </div>
      <div class="col-lg-7">
        <form id="form" class="gfs-card">
          <div class="mb-3">
            <label class="form-label">Odometer mileage (km)</label>
            <input type="number" id="mileage" class="form-control" min="0" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Location (text)</label>
            <input type="text" id="location" class="form-control" required />
          </div>
          <div class="mb-3 small muted" id="geo">GPS: waiting…</div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="damage" />
            <label class="form-check-label" for="damage"><strong>Report damage</strong> on this vehicle</label>
          </div>
          <div class="mb-3 d-none" id="damageBox">
            <label class="form-label">Damage description</label>
            <textarea id="damageDesc" class="form-control" rows="3" placeholder="Describe what you see…"></textarea>
          </div>
          <button class="btn btn-sb" type="submit">Complete check-in</button>
          <p id="msg" class="small mt-3 mb-0"></p>
        </form>
      </div>
    </div>
  </main>
  <script src="/static/js/api.js?v=2"></script>
  <script src="/static/js/camera.js"></script>
  <script>
    GFS.ready(function (GFS) {
    var api = GFS.api, renderHeader = GFS.renderHeader, wireLogout = GFS.wireLogout, formatDt = GFS.formatDt;
    var CameraCapture = window.GFSCamera.CameraCapture, getGeo = window.GFSCamera.getGeo;
    if (!api.requireAuth()) return;
    document.getElementById("header").innerHTML = renderHeader("checkin", "app");
    wireLogout();

    const photos = {};
    let geo = { latitude: null, longitude: null };
    const params = new URLSearchParams(location.search);

    document.getElementById("damage").onchange = (e) => {
      document.getElementById("damageBox").classList.toggle("d-none", !e.target.checked);
    };

    getGeo().then(g => {
      geo = g;
      document.getElementById("geo").textContent =
        g.latitude != null ? `GPS: ${g.latitude.toFixed(5)}, ${g.longitude.toFixed(5)}` : "GPS: unavailable (text location still required)";
    });

    function renderThumbs() {
      document.getElementById("thumbs").innerHTML = Object.entries(photos).map(([angle, url]) =>
        `<div><img src="${url}" alt="${angle}" /><div class="small text-center">${angle}</div></div>`
      ).join("");
    }

    document.getElementById("startCam").onclick = async () => {
      try { await CameraCapture.start(document.getElementById("video")); }
      catch (e) { alert(e.message); }
    };
    document.getElementById("snap").onclick = () => {
      const angle = document.getElementById("angle").value;
      photos[angle] = CameraCapture.snap(document.getElementById("video"), document.getElementById("canvas"));
      renderThumbs();
    };

    api.get("/api/bookings/mine").then(rows => {
      const eligible = rows.filter(b =>
        (b.BookingStatus === "Checked Out" || b.BookingStatus === "Flagged") &&
        b.CheckOutTimestamp && !b.CheckInTimestamp
      );
      const sel = document.getElementById("booking");
      if (!eligible.length) {
        sel.innerHTML = `<option value="">No trips ready for check-in</option>`;
        return;
      }
      sel.innerHTML = eligible.map(b =>
        `<option value="${b.BookingID}">#${b.BookingID} - ${b.VehicleReg} (out at ${b.CheckOutMileage} km)</option>`
      ).join("");
      if (params.get("id")) sel.value = params.get("id");
      const sync = () => {
        const b = eligible.find(x => String(x.BookingID) === sel.value);
        document.getElementById("bookingInfo").textContent = b
          ? `Checked out ${formatDt(b.CheckOutTimestamp)} at ${b.CheckOutMileage} km. Return deadline: ${formatDt(b.CheckInDeadline)}`
          : "";
        if (b) document.getElementById("mileage").min = b.CheckOutMileage;
      };
      sel.onchange = sync;
      sync();
    });

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.className = "small mt-3 mb-0";
      const angles = ["front", "back", "left", "right", "odometer"];
      const missing = angles.filter(a => !photos[a]);
      if (missing.length) {
        msg.classList.add("text-danger");
        msg.textContent = "Missing photos: " + missing.join(", ");
        return;
      }
      const damage = document.getElementById("damage").checked;
      const bookingId = document.getElementById("booking").value;
      try {
        await api.post(`/api/bookings/${bookingId}/check-in`, {
          Mileage: Number(document.getElementById("mileage").value),
          LocationText: document.getElementById("location").value,
          Latitude: geo.latitude,
          Longitude: geo.longitude,
          Photos: angles.map(a => ({ angle: a, data_url: photos[a] })),
          DamageNoted: damage,
          DamageDescription: damage ? document.getElementById("damageDesc").value : null,
        });
        CameraCapture.stop();
        msg.classList.add("text-success");
        msg.textContent = damage
          ? "Check-in complete. Damage incident created and managers notified."
          : "Check-in complete. Return the key to the approving manager.";
        setTimeout(() => location.href = "/app/trips.html", 1400);
      } catch (err) {
        msg.classList.add("text-danger");
        msg.textContent = err.message;
      }
    };

    window.addEventListener("beforeunload", () => CameraCapture.stop());
    });
  </script>
</body>
</html>
