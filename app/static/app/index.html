<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/static/img/favicon.png?v=2" type="image/png" sizes="32x32" />
  <link rel="shortcut icon" href="/static/img/favicon.ico?v=2" />
  <title>Vehicles - GFS App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/static/css/theme.css" rel="stylesheet" />
</head>
<body>
  <div id="header"></div>
  <main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="h4 mb-1">Vehicle availability</h1>
        <p class="muted mb-0">Review the status of GFS pool vehicles and submit a booking request.</p>
      </div>
      <a class="btn btn-sb" href="/app/request.html">Request a car</a>
    </div>
    <div id="list" class="row g-3"></div>
    <p id="err" class="text-danger mt-3"></p>
  </main>
  <script src="/static/js/api.js?v=3"></script>
  <script>
    GFS.ready(function (GFS) {
      var user = GFS.api.requireAuth();
      if (!user) return;
      document.getElementById("header").innerHTML = GFS.renderHeader("home", "app");
      GFS.wireLogout();

      GFS.api.get("/api/vehicles").then(function (vehicles) {
        var el = document.getElementById("list");
        if (!vehicles.length) {
          el.innerHTML = '<div class="col-12 muted">No active vehicles.</div>';
          return;
        }
        el.innerHTML = vehicles.map(function (v) {
          var availLine = "";
          if (v.CurrentStatus === "Available") {
            availLine = '<div class="small mt-2 text-success">Available now</div>';
          } else if (v.NextAvailableFrom) {
            availLine =
              '<div class="small mt-2"><strong>Next available:</strong> ' +
              GFS.formatDateLong(v.NextAvailableFrom) + "</div>";
          }
          var canImmediate = v.CurrentStatus === "Available";
          return (
            '<div class="col-md-6"><div class="gfs-card h-100">' +
            '<div class="d-flex justify-content-between"><strong>' + v.MakeModel + "</strong>" +
            GFS.statusPill(v.CurrentStatus) + "</div>" +
            '<div class="muted small mt-1">' + v.RegistrationNumber + "</div>" +
            '<div class="mt-2 small">Parking: ' + (v.CurrentParkingLocation || "-") + "</div>" +
            '<div class="small">Mileage: ' + v.CurrentMileage.toLocaleString() + " km</div>" +
            availLine +
            '<div class="d-flex flex-wrap gap-2 mt-3">' +
            (canImmediate
              ? '<a class="btn btn-sm btn-sb" href="/app/request.html?vehicle=' + v.VehicleID + '">Request now</a>'
              : '<a class="btn btn-sm btn-sb" href="/app/request.html?vehicle=' + v.VehicleID +
                '&type=Advance">Reserve for later</a>') +
            "</div>" +
            "</div></div>"
          );
        }).join("");
      }).catch(function (e) {
        document.getElementById("err").textContent = e.message;
      });
    });
  </script>
</body>
</html>
