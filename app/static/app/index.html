<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vehicles - GFS App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/static/css/theme.css" rel="stylesheet" />
</head>
<body>
  <div id="header"></div>
  <main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="h4 mb-1">Pool vehicles</h1>
        <p class="muted mb-0">Availability only - request a car when status is Available.</p>
      </div>
      <a class="btn btn-sb" href="/app/request.html">Request a car</a>
    </div>
    <div id="list" class="row g-3"></div>
    <p id="err" class="text-danger mt-3"></p>
  </main>
  <script src="/static/js/api.js?v=2"></script>
  <script>
    GFS.ready(function (GFS) {
      var user = GFS.api.requireAuth();
      if (!user) return;
      document.getElementById("header").innerHTML = GFS.renderHeader("home", "app");
      GFS.wireLogout();

      GFS.api.get("/api/vehicles").then(function (vehicles) {
        var el = document.getElementById("list");
        if (!vehicles.length) {
          el.innerHTML = '<div class="col-12 muted">No active vehicles.</div>';
          return;
        }
        el.innerHTML = vehicles.map(function (v) {
          return (
            '<div class="col-md-6"><div class="gfs-card h-100">' +
            '<div class="d-flex justify-content-between"><strong>' + v.MakeModel + "</strong>" +
            GFS.statusPill(v.CurrentStatus) + "</div>" +
            '<div class="muted small mt-1">' + v.RegistrationNumber + "</div>" +
            '<div class="mt-2 small">Parking: ' + (v.CurrentParkingLocation || "-") + "</div>" +
            '<div class="small">Mileage: ' + v.CurrentMileage.toLocaleString() + " km</div>" +
            (v.CurrentStatus !== "Available" && v.CurrentDriverName
              ? '<div class="small mt-2">With: <strong>' + v.CurrentDriverName + "</strong></div>"
              : "") +
            (v.CurrentStatus === "Available"
              ? '<a class="btn btn-sm btn-sb mt-3" href="/app/request.html?vehicle=' + v.VehicleID + '">Request</a>'
              : '<button class="btn btn-sm btn-secondary mt-3" disabled>Not bookable</button>') +
            "</div></div>"
          );
        }).join("");
      }).catch(function (e) {
        document.getElementById("err").textContent = e.message;
        if (e.status === 401) window.location.href = "/login.html";
      });
    });
  </script>
</body>
</html>
