<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request - GFS App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/static/css/theme.css" rel="stylesheet" />
</head>
<body>
  <div id="header"></div>
  <main class="container pb-5" style="max-width:640px">
    <h1 class="h4 mb-3">Request a vehicle</h1>
    <form id="form" class="gfs-card">
      <div class="mb-3">
        <label class="form-label">Booking type</label>
        <select id="type" class="form-select">
          <option value="Immediate">Immediate (car must be Available now)</option>
          <option value="Advance Reservation">Advance Reservation (future window)</option>
        </select>
        <div class="form-text" id="typeHint">Immediate requests are only allowed when the vehicle is Available.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Vehicle</label>
        <select id="vehicle" class="form-select" required></select>
      </div>
      <div id="advanceFields" class="row g-2 mb-3 d-none">
        <div class="col-md-6">
          <label class="form-label">Start</label>
          <input type="datetime-local" id="start" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">End</label>
          <input type="datetime-local" id="end" class="form-control" />
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Purpose / Reason</label>
        <textarea id="purpose" class="form-control" rows="2" required></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Destination</label>
        <input id="destination" class="form-control" required />
      </div>
      <button class="btn btn-sb" type="submit">Submit request</button>
      <p id="msg" class="small mt-3 mb-0"></p>
    </form>
  </main>

  <div id="successPopup" class="gfs-popup-backdrop" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <div class="gfs-popup">
      <div class="gfs-popup-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M8 12.5l2.5 2.5L16 9"/>
        </svg>
      </div>
      <div class="gfs-popup-title" id="popupTitle">Request submitted</div>
      <p class="gfs-popup-text">
        Your vehicle request has been sent for manager approval.
        Please await an email notification with the approval or rejection outcome.
      </p>
      <p class="gfs-popup-ref" id="popupRef"></p>
      <button type="button" class="btn btn-sb w-100" id="popupOk">OK</button>
    </div>
  </div>

  <script src="/static/js/api.js?v=2"></script>
  <script>
    GFS.ready(function (GFS) {
    var api = GFS.api, renderHeader = GFS.renderHeader, wireLogout = GFS.wireLogout;
    if (!api.requireAuth()) return;
    document.getElementById("header").innerHTML = renderHeader("request", "app");
    wireLogout();

    const params = new URLSearchParams(location.search);
    const preselect = params.get("vehicle");
    let allVehicles = [];

    function fillVehicles() {
      const type = document.getElementById("type").value;
      const sel = document.getElementById("vehicle");
      const hint = document.getElementById("typeHint");
      let list;
      if (type === "Immediate") {
        list = allVehicles.filter(v => v.CurrentStatus === "Available");
        hint.textContent = "Immediate: only Available vehicles are listed. If both cars are out, use Advance Reservation.";
      } else {
        list = allVehicles.slice();
        hint.textContent = "Advance: you may reserve a car that is currently In Use / Reserved for a future start time after it returns.";
      }
      if (!list.length) {
        sel.innerHTML = `<option value="">No vehicles match this booking type</option>`;
        return;
      }
      sel.innerHTML = list.map(v =>
        `<option value="${v.VehicleID}">${v.MakeModel} (${v.RegistrationNumber}) - ${v.CurrentStatus}</option>`
      ).join("");
      if (preselect && list.some(v => String(v.VehicleID) === String(preselect))) {
        sel.value = preselect;
      }
    }

    api.get("/api/vehicles").then(vehicles => {
      allVehicles = vehicles;
      fillVehicles();
    });

    document.getElementById("type").addEventListener("change", (e) => {
      const advance = e.target.value === "Advance Reservation";
      document.getElementById("advanceFields").classList.toggle("d-none", !advance);
      fillVehicles();
    });

    function showSuccessPopup(bookingId) {
      document.getElementById("popupRef").textContent = "Reference: Booking #" + bookingId;
      const popup = document.getElementById("successPopup");
      popup.classList.add("show");
    }

    function hideSuccessPopup() {
      document.getElementById("successPopup").classList.remove("show");
    }

    document.getElementById("popupOk").addEventListener("click", hideSuccessPopup);
    document.getElementById("successPopup").addEventListener("click", function (e) {
      if (e.target === this) hideSuccessPopup();
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.textContent = "";
      msg.className = "small mt-3 mb-0";
      const type = document.getElementById("type").value;
      const body = {
        VehicleID: Number(document.getElementById("vehicle").value),
        BookingType: type,
        PurposeReason: document.getElementById("purpose").value,
        Destination: document.getElementById("destination").value,
      };
      if (type === "Advance Reservation") {
        const startVal = document.getElementById("start").value;
        const endVal = document.getElementById("end").value;
        if (!startVal || !endVal) {
          msg.classList.add("text-danger");
          msg.textContent = "Start and End are required for Advance Reservation.";
          return;
        }
        body.ReservationStart = new Date(startVal).toISOString();
        body.ReservationEnd = new Date(endVal).toISOString();
      }
      try {
        const b = await api.post("/api/bookings", body);
        e.target.reset();
        document.getElementById("advanceFields").classList.add("d-none");
        fillVehicles();
        showSuccessPopup(b.BookingID);
      } catch (err) {
        msg.classList.add("text-danger");
        msg.textContent = err.message;
      }
    });
    });
  </script>
</body>
</html>
