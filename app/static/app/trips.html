<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Trips - GFS App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/static/css/theme.css" rel="stylesheet" />
</head>
<body>
  <div id="header"></div>
  <main class="container pb-5">
    <h1 class="h4 mb-3">My trips</h1>
    <div class="gfs-card table-responsive">
      <table class="table table-sm mb-0">
        <thead>
          <tr>
            <th>ID</th><th>Vehicle</th><th>Status</th><th>Purpose</th><th>Requested</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="err" class="text-danger mt-3"></p>
  </main>
  <script src="/static/js/api.js?v=2"></script>
  <script>
    GFS.ready(function (GFS) {
    var api = GFS.api, renderHeader = GFS.renderHeader, wireLogout = GFS.wireLogout;
    var formatDt = GFS.formatDt, statusPill = GFS.statusPill;
    if (!api.requireAuth()) return;
    document.getElementById("header").innerHTML = renderHeader("trips", "app");
    wireLogout();

    async function cancelBooking(id) {
      if (!confirm("Cancel this pending request?")) return;
      try {
        await api.post(`/api/bookings/${id}/cancel`, {});
        location.reload();
      } catch (e) {
        alert(e.message);
      }
    }

    api.get("/api/bookings/mine").then(rows => {
      document.getElementById("rows").innerHTML = rows.map(b => `
        <tr>
          <td>${b.BookingID}</td>
          <td>${b.VehicleMakeModel || ""}<div class="small muted">${b.VehicleReg || ""}</div></td>
          <td>${statusPill(b.BookingStatus)}</td>
          <td>${b.PurposeReason}<div class="small muted">${b.Destination}</div></td>
          <td class="small">${formatDt(b.RequestedAt)}</td>
          <td class="text-nowrap">
            ${b.BookingStatus === "Pending Approval"
              ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelBooking(${b.BookingID})">Cancel</button>` : ""}
            ${(b.BookingStatus === "Approved" || b.BookingStatus === "Flagged") && b.KeyCollected && !b.CheckOutTimestamp
              ? `<a class="btn btn-sm btn-sb" href="/app/checkout.html?id=${b.BookingID}">Check-Out</a>` : ""}
            ${(b.BookingStatus === "Checked Out" || (b.BookingStatus === "Flagged" && b.CheckOutTimestamp)) && !b.CheckInTimestamp
              ? `<a class="btn btn-sm btn-sb" href="/app/checkin.html?id=${b.BookingID}">Check-In</a>` : ""}
          </td>
        </tr>`).join("") || `<tr><td colspan="6" class="muted">No trips yet.</td></tr>`;
    }).catch(e => document.getElementById("err").textContent = e.message);

    window.cancelBooking = cancelBooking;
    });
  </script>
</body>
</html>
