<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - GFS Vehicles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/static/css/theme.css" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <div class="login-hero gfs-card text-center">
      <img src="/static/img/logo.png" alt="Standard Bank" style="height:72px" class="mb-3" />
      <h1 class="h4 mb-1">GFS Vehicle Management</h1>
      <p class="muted mb-4">Group Forensic Services - local prototype</p>

      <button id="ssoBtn" class="btn btn-sb w-100" type="button">
        Login with SSO
      </button>
      <p id="ssoHint" class="small muted mt-2 mb-0">
        Use your Standard Bank email and password (coming soon)
      </p>
      <p id="ssoMsg" class="small text-warning mt-2 mb-0 d-none"></p>

      <div class="login-divider my-4"><span>or demo sign-in</span></div>

      <label class="form-label text-start w-100">Select user</label>
      <select id="userSelect" class="form-select mb-3" disabled>
        <option value="">Loading users…</option>
      </select>
      <button id="loginBtn" class="btn btn-sb-outline w-100" disabled type="button">Sign in (prototype)</button>
      <p id="status" class="small muted mt-3 mb-0"></p>
      <p id="err" class="text-danger small mt-2 mb-0"></p>
    </div>
  </div>
  <script>
    (function () {
      const SESSION_KEY = "gfs_session";
      const USER_KEY = "gfs_user";
      const sel = document.getElementById("userSelect");
      const btn = document.getElementById("loginBtn");
      const ssoBtn = document.getElementById("ssoBtn");
      const ssoMsg = document.getElementById("ssoMsg");
      const err = document.getElementById("err");
      const status = document.getElementById("status");

      status.textContent = "Page: " + window.location.href;

      ssoBtn.addEventListener("click", function () {
        ssoMsg.classList.remove("d-none");
        ssoMsg.textContent =
          "SSO is not connected yet. Once IT provides Standard Bank employee directory / Entra ID details, staff will sign in here with their @standardbank.co.za email and password. For now, use demo sign-in below.";
      });

      if (window.location.protocol === "file:") {
        sel.innerHTML = '<option value="">Cannot load - open via server URL</option>';
        err.textContent =
          "You opened this as a file on disk. Start the server, then open http://127.0.0.1:8001/login.html in Chrome or Edge.";
        return;
      }

      async function apiGet(path) {
        const res = await fetch(path);
        const text = await res.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch { data = { detail: text }; }
        if (!res.ok) {
          const detail = data && data.detail;
          throw new Error(typeof detail === "string" ? detail : "Could not load users (HTTP " + res.status + ")");
        }
        return data;
      }

      async function apiPost(path, body) {
        const res = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const text = await res.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch { data = { detail: text }; }
        if (!res.ok) {
          const detail = data && data.detail;
          throw new Error(typeof detail === "string" ? detail : "Login failed (HTTP " + res.status + ")");
        }
        return data;
      }

      async function loadUsers() {
        try {
          const users = await apiGet("/api/auth/users");
          if (!users || !users.length) {
            sel.innerHTML = '<option value="">No users in database</option>';
            err.textContent = "Run: .\\.venv\\Scripts\\python.exe seed.py --reset";
            return;
          }
          sel.innerHTML = users.map(function (u) {
            return '<option value="' + u.Username + '">' + u.DisplayName + " (" + u.Role + ")</option>";
          }).join("");
          sel.disabled = false;
          btn.disabled = false;
          status.textContent = users.length + " users loaded · " + window.location.origin;
        } catch (e) {
          sel.innerHTML = '<option value="">Could not load users</option>';
          err.textContent =
            (e.message || String(e)) +
            " - Is the server running? Try: .\\.venv\\Scripts\\python.exe -m uvicorn app.main:app --host 127.0.0.1 --port 8001";
        }
      }

      btn.addEventListener("click", async function () {
        err.textContent = "";
        btn.disabled = true;
        try {
          const username = sel.value;
          if (!username) throw new Error("Select a user first");
          const res = await apiPost("/api/auth/login", { Username: username });
          localStorage.setItem(SESSION_KEY, res.session_token);
          localStorage.setItem(USER_KEY, JSON.stringify(res.user));
          const role = res.user.Role;
          if (role === "Manager" || role === "Admin") {
            window.location.href = "/admin/index.html";
          } else {
            window.location.href = "/app/index.html";
          }
        } catch (e) {
          err.textContent = e.message || String(e);
          btn.disabled = false;
        }
      });

      loadUsers();
    })();
  </script>
</body>
</html>
