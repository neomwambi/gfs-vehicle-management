<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">GFS vehicle booking state machine</title>
  <desc id="desc">Happy path from request through key return, with reject, cancel, and flagged missed-window branches.</desc>
  <rect width="1280" height="720" fill="#F7F9FC"/>
  <text x="40" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#001F5B">Booking lifecycle</text>
  <text x="40" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4A5A73">Same approving manager confirms key handover and key return. Missed windows Flag the trip  they do not cancel it.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0033A0"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/>
    </marker>
  </defs>

  <!-- Happy path -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">
    <rect x="40" y="160" width="150" height="64" rx="8" fill="#E8F1FB" stroke="#0033A0"/>
    <text x="115" y="187" fill="#001F5B" font-weight="600">Request</text>
    <text x="115" y="206" fill="#4A5A73" font-size="11">Employee</text>

    <rect x="230" y="160" width="150" height="64" rx="8" fill="#0033A0"/>
    <text x="305" y="187" fill="#FFFFFF" font-weight="600">Pending</text>
    <text x="305" y="206" fill="#D6E4F7" font-size="11">Awaiting manager</text>

    <rect x="420" y="160" width="150" height="64" rx="8" fill="#0033A0"/>
    <text x="495" y="187" fill="#FFFFFF" font-weight="600">Approved</text>
    <text x="495" y="206" fill="#D6E4F7" font-size="11">Manager decide</text>

    <rect x="610" y="160" width="150" height="64" rx="8" fill="#E8F1FB" stroke="#0033A0"/>
    <text x="685" y="187" fill="#001F5B" font-weight="600">Keys collected</text>
    <text x="685" y="206" fill="#4A5A73" font-size="11">Approver only</text>

    <rect x="800" y="160" width="150" height="64" rx="8" fill="#0033A0"/>
    <text x="875" y="187" fill="#FFFFFF" font-weight="600">Checked Out</text>
    <text x="875" y="206" fill="#D6E4F7" font-size="11">5 photos + mileage</text>

    <rect x="990" y="160" width="150" height="64" rx="8" fill="#0033A0"/>
    <text x="1065" y="187" fill="#FFFFFF" font-weight="600">Checked In</text>
    <text x="1065" y="206" fill="#D6E4F7" font-size="11">5 photos + mileage</text>

    <rect x="1090" y="300" width="150" height="64" rx="8" fill="#001F5B"/>
    <text x="1165" y="327" fill="#FFFFFF" font-weight="600">Closed</text>
    <text x="1165" y="346" fill="#B8C7E0" font-size="11">Key return</text>
  </g>

  <!-- Side branches -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">
    <rect x="230" y="40" width="150" height="56" rx="8" fill="#F4F7FB" stroke="#8AA0C0"/>
    <text x="305" y="64" fill="#4A5A73" font-weight="600">Cancelled</text>
    <text x="305" y="82" fill="#6B7C93" font-size="11">While pending only</text>

    <rect x="230" y="300" width="150" height="56" rx="8" fill="#F4F7FB" stroke="#8AA0C0"/>
    <text x="305" y="324" fill="#4A5A73" font-weight="600">Rejected</text>
    <text x="305" y="342" fill="#6B7C93" font-size="11">Reason required</text>

    <rect x="705" y="420" width="240" height="72" rx="8" fill="#FFF7ED" stroke="#B45309"/>
    <text x="825" y="450" fill="#9A3412" font-weight="600">Flagged</text>
    <text x="825" y="470" fill="#B45309" font-size="11">Missed check-out or overdue return</text>
  </g>

  <!-- Arrows happy path -->
  <g stroke="#0033A0" stroke-width="1.75" fill="none" marker-end="url(#arrow)">
    <line x1="190" y1="192" x2="230" y2="192"/>
    <line x1="380" y1="192" x2="420" y2="192"/>
    <line x1="570" y1="192" x2="610" y2="192"/>
    <line x1="760" y1="192" x2="800" y2="192"/>
    <line x1="950" y1="192" x2="990" y2="192"/>
    <path d="M 1065 224 L 1065 300"/>
  </g>

  <!-- Cancel / reject -->
  <g stroke="#8AA0C0" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="305" y1="160" x2="305" y2="96"/>
    <line x1="305" y1="224" x2="305" y2="300"/>
  </g>

  <!-- Flagged cycle -->
  <g stroke="#B45309" stroke-width="1.6" fill="none" marker-end="url(#arrowWarn)" stroke-dasharray="5 4">
    <path d="M 685 224 L 685 456 L 705 456"/>
    <path d="M 875 224 L 875 420"/>
    <path d="M 825 420 L 825 224"/>
    <path d="M 945 456 L 1065 456 L 1065 224"/>
  </g>

  <!-- Legend -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12">
    <rect x="40" y="560" width="700" height="120" rx="8" fill="#FFFFFF" stroke="#D5DEEA"/>
    <text x="60" y="588" font-weight="700" fill="#001F5B">How to read this</text>
    <rect x="60" y="608" width="18" height="12" fill="#0033A0"/>
    <text x="86" y="618" fill="#4A5A73">Primary status on the happy path</text>
    <rect x="60" y="630" width="18" height="12" fill="#FFF7ED" stroke="#B45309"/>
    <text x="86" y="640" fill="#4A5A73">Flagged: incident raised; driver can still check out / in</text>
    <line x1="60" y1="658" x2="90" y2="658" stroke="#B45309" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="98" y="662" fill="#4A5A73">Dashed orange = deadline scanner (deadlines.py)</text>
  </g>
</svg>
